services:
  - type: web
    name: namma-yatra-platform
    env: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: YatraAI
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
